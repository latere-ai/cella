# The two control-plane accounts. The control plane's account holds no Role in
# `latere`: everything the driver does is in cella-workloads or the one
# cluster-scoped read in deploy/prod-bootstrap/rbac.yaml. Both pull with
# `ghcr-secret`, the docker-registry Secret every service in `latere` pulls with.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cellad
  namespace: latere
imagePullSecrets:
  - name: ghcr-secret
---
# The gateway drives no cluster API. It mounts no token and holds no role;
# the pull secret is all its account carries.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cellad-egress
  namespace: latere
imagePullSecrets:
  - name: ghcr-secret
