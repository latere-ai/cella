#
# The two optional Secrets of deploy/bootstrap, filled with the stubs'
# values. They are a URL and the credential that authorises it, one Secret
# each, because a URL without its credential is a start-up failure and the
# pair is rotated together.
#
# Neither value is a credential: they are what the stub in this Pod is
# started with, and they authorise nothing outside this cluster.
apiVersion: v1
kind: Secret
metadata:
  name: cellad-authorizer
type: Opaque
stringData:
  CELLA_AUTHORIZER_URL: "http://127.0.0.1:9081"
  CELLA_AUTHORIZER_TOKEN: "stub-authorizer-token"
---
apiVersion: v1
kind: Secret
metadata:
  name: cellad-events
type: Opaque
stringData:
  CELLA_EVENTS_URL: "http://127.0.0.1:9083"
  CELLA_EVENTS_SECRET: "stub-events-secret"
