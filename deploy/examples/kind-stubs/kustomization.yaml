#
# The laptop cluster of ../kind with the test stubs of spec 012 beside the
# control plane: an OpenID Connect issuer, an authorization endpoint and an
# event sink, so a cluster with no dependency of its own runs the whole
# installation and the install document walks green in continuous
# integration.
#
# It is a test installation and not an installation. Every endpoint here is
# a stub that answers what its flags say; in a real one each of them is the
# operator's.
#
# Beside them run the egress gateway, `cellad egress` with an environment
# key up.sh mints at the control plane, and an upstream host a sandbox may
# be allowed to reach, so the boundary of spec 018 is enforced and proved on
# the cluster rather than recorded.
#
# The stubs are a container of the control plane's own Pod and not a
# Deployment of their own. CELLA_AUTHORIZER_URL that is http:// on a host
# other than loopback is a start-up failure with no escape hatch (spec
# 006), and spec 007 states the same rule for the admission endpoint, so
# sharing the Pod's network namespace is what makes every endpoint
# http://127.0.0.1:<port> with nothing waived.
#
# The images are the three this repository builds, under the tag the
# cluster was loaded with:
#
#	docker build -t cellad:dev . && docker build -f Dockerfile.stubs -t cella-stubs:dev .
#	docker build -f images/display/Dockerfile -t cella-display:dev .
#	kind load docker-image cellad:dev cella-stubs:dev cella-display:dev --name cella
#
# up.sh does both and prints the URL and the token to drive it with.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cella
resources:
  - ../kind
  - secrets.yaml
  - service-stubs.yaml
  - gateway.yaml
  - upstream.yaml
patches:
  - path: stubs-sidecar.yaml
    target:
      kind: Deployment
      name: cellad
  - path: stubs-sidecar-job.yaml
    target:
      kind: Job
      name: cellad-check
  - path: configmap.yaml
    target:
      kind: ConfigMap
      name: cellad
  - path: networkpolicy.yaml
    target:
      kind: NetworkPolicy
      name: cellad
images:
  - name: cellad
    newTag: dev
  - name: cella-stubs
    newTag: dev
