#
# The stubs beside the control plane, as a sidecar in the Kubernetes sense:
# an init container with restartPolicy Always, which starts before the main
# container and is terminated with it.
#
# The ordering is not enough on its own. `cellad serve` reads the issuer's
# discovery document and key set at start and refuses to start without
# them, so the startup probe over that document is what the main container
# actually waits on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cellad
spec:
  template:
    spec:
      initContainers:
        - name: stubs
          image: cella-stubs
          restartPolicy: Always
          args:
            - -issuer=127.0.0.1:9080
            - -issuer-url=http://127.0.0.1:9080
            - -issuer-audience=cella
            - -authorizer=127.0.0.1:9081
            - -authorizer-token=stub-authorizer-token
            - -admission=127.0.0.1:9082
            - -sink=127.0.0.1:9083
            - -sink-secret=stub-events-secret
          ports:
            - name: issuer
              containerPort: 9080
            - name: sink
              containerPort: 9083
          startupProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: issuer
            periodSeconds: 1
            failureThreshold: 60
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
