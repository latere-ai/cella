#
# The cluster the install document brings up: one node, with the public
# listener's node port published to the host.
#
#	kind create cluster --name cella --config kind.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
