#
# A cluster an installation runs on: desired state in Postgres, an
# authorization endpoint, an event sink, an egress gateway beside the
# control plane, and an ingress of the installation's own in front of the
# Service. Everything a credential is in the Secrets of deploy/bootstrap;
# everything else is below.
#
# Set the image to the release you are installing:
#
#	kustomize edit set image cellad=ghcr.io/<owner>/cellad:<tag>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cella
resources:
  - ../../base
  - configmap.yaml
