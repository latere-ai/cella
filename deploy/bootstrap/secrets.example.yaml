#
# The credentials, applied once by hand and never from a kustomization: a
# secret an apply owns is a secret a re-apply can overwrite with the value
# that was in the tree. Copy this file, fill it, apply it, and keep the
# copy where your secrets live and not in a checkout.
#
# Only cellad-token is required. Each of the others turns on the dependency
# it names, and an installation without it runs on the built-in behavior:
# the owner policy, the journal with no delivery, the memory store.
#
# One rule runs through every pair below: a URL and the bearer that
# authorizes it live in one Secret and rotate together, because a URL with
# no bearer is a start-up failure and a bearer with no URL is an
# installation that believes it calls an endpoint and does not.
#
#	kubectl -n cella apply -f secrets.yaml
---
# Required. The RSA key cellad signs every workload token and environment
# key with, and serves the public half of at /.well-known/jwks.json.
#
#	openssl genrsa 2048
#
# Two PEM blocks are a rotation: prepend the new key, apply, and remove the
# old block on a later apply. The first block signs; every block is in the
# key set, so nothing a sandbox holds is refused in between.
apiVersion: v1
kind: Secret
metadata:
  name: cellad-token
  namespace: cella
type: Opaque
stringData:
  CELLA_TOKEN_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    ... openssl genrsa 2048 ...
    -----END RSA PRIVATE KEY-----
---
# Optional. The endpoint that decides what a caller may do (spec 006), and
# the bearer cellad sends it. With no Secret the built-in owner policy
# decides: every subject acts on what it owns, and CELLA_ADMIN_SUBJECTS in
# the ConfigMap names who acts on everything.
#
# The URL is https unless it is on loopback: a decision and the bearer that
# authorizes it do not travel in the clear, and cellad refuses to start
# otherwise.
#
#	openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: cellad-authorizer
  namespace: cella
type: Opaque
stringData:
  CELLA_AUTHORIZER_URL: "https://authz.example.com/authorize"
  CELLA_AUTHORIZER_TOKEN: "..."
---
# Optional. Where one signed record per change and per operation goes
# (spec 009), and the secret that signs it. With no Secret the journal
# still holds every record and nothing is delivered.
#
# CELLA_EVENTS_SECRET takes two values separated by a comma while it is
# being rotated, and each signs the delivery, so either end may move first.
#
#	openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: cellad-events
  namespace: cella
type: Opaque
stringData:
  CELLA_EVENTS_URL: "https://events.example.com/cella"
  CELLA_EVENTS_SECRET: "..."
---
# Optional. The Postgres desired state lives in (spec 010) and the key
# every secret value's data key is sealed under (spec 018). With no Secret
# every state is in memory: one replica, nothing across a restart, and no
# recovery of a sandbox the backend lost.
#
# The URL names the direct endpoint and not a transaction-mode pooler: a
# migration holds a session-scoped lock across its statements, which such a
# pooler loses between transactions.
#
#	openssl rand -base64 32
#
# A dump of the tables is ciphertext under CELLA_SECRET_KEY, so a backup is
# safe only while this key is held apart from it.
apiVersion: v1
kind: Secret
metadata:
  name: cellad-db
  namespace: cella
type: Opaque
stringData:
  CELLA_DB_URL: "postgres://cella:...@postgres.example.com:5432/cella?sslmode=require"
  CELLA_SECRET_KEY: "..."
---
# Optional, and read by the egress gateway rather than by the control
# plane. `cellad egress` is the second role of the same image (spec 018);
# this base deploys the control plane alone, so the Deployment that reads
# this Secret is one an installation writes beside it.
#
# CELLA_ENVIRONMENT_KEY authenticates the one stream the gateway opens
# outbound to the control plane and names the environment it serves. It is
# minted at the control plane.
#
# CELLA_EGRESS_CA_KEY is one PEM value carrying a CERTIFICATE block and a
# private key block, in either order: a gateway given only a key could not
# tell a sandbox what to trust. Unset, each gateway generates an authority
# that lives for its process, so an environment with several gateways sets
# one value on every one of them.
#
#	openssl ecparam -genkey -name prime256v1 -out ca.key
#	openssl req -x509 -new -key ca.key -days 3650 -subj /CN=cella-egress -out ca.crt
#	cat ca.crt ca.key
apiVersion: v1
kind: Secret
metadata:
  name: cellad-egress
  namespace: cella
type: Opaque
stringData:
  CELLA_ENVIRONMENT_KEY: "..."
  CELLA_EGRESS_CA_KEY: |
    -----BEGIN CERTIFICATE-----
    ...
    -----END CERTIFICATE-----
    -----BEGIN EC PRIVATE KEY-----
    ...
    -----END EC PRIVATE KEY-----
