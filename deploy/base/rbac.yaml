#
# Exactly the accesses the Kubernetes driver uses, in the one namespace it
# writes in, and nothing else: the driver's own verbs table is the source
# and a test holds this file to it. The driver proves each one at
# start with a SelfSubjectAccessReview, so a rule missing here is named in
# the start-up log and by `cellad check` rather than found at the first
# create. SelfSubjectAccessReview itself needs no rule: the cluster's
# system:basic-user role grants it to system:authenticated.
#
# What is deliberately absent:
#
#   watch          the driver lists and gets; it opens no watch
#   nodes          nothing schedules by hand
#
# pods/exec takes two verbs because the driver's exec, the one a terminal
# and every command ride on, tries a WebSocket first and falls back to SPDY:
# the API server authorizes the WebSocket's GET as get (and from Kubernetes
# 1.35 as create as well) and the SPDY upgrade's POST as create.
#
# Two objects the driver does write, and why: a Secret per sandbox holds
# the workload token (spec 006) and never a secret value, which stays
# sealed in the store under CELLA_SECRET_KEY; a NetworkPolicy and a
# headless Service per mesh (spec 022) admit peers to each other, while
# the egress boundary stays the gateway's (spec 018).
#
# A namespace is not named here. The overlay sets one for every object,
# and the Deployment reads its own from the downward API, so the driver
# writes where this Role grants and not in the driver's default namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cellad
  labels:
    app.kubernetes.io/name: cellad
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cellad
  labels:
    app.kubernetes.io/name: cellad
subjects:
  - kind: ServiceAccount
    name: cellad
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cellad
