#
# The account the control plane reaches the API server with. Unlike a
# sandbox Pod, which mounts no token at all, cellad mounts one: the
# Kubernetes driver of spec 004 builds its client from the in-cluster
# configuration, so no token means no API server and Preflight fails at
# start.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cellad
  labels:
    app.kubernetes.io/name: cellad
    app.kubernetes.io/component: control-plane
