# The access of the Kubernetes driver in the workloads namespace, and the
# namespace's default account. All of it is outside `latere`, where the
# release's rollout identity writes, and two of the objects are cluster
# scoped, so an operator applies this file.
#
# The driver proves its access at start with one SelfSubjectAccessReview per
# verb, so a rule missing here is named in the start-up log rather than found
# at the first create. SelfSubjectAccessReview itself needs no rule: the
# cluster's `system:basic-user` ClusterRole grants it to `system:authenticated`.
#
# The control plane's account holds no Role in `latere`. Everything the driver
# does is in cella-workloads or the one cluster-scoped read below, and nothing
# grants it a verb in its own namespace.
# Sandbox Pods run under the workloads namespace's default account with no
# token mounted (the driver sets automountServiceAccountToken false). They do
# need the pull secret to fetch an image from ghcr.io/latere-ai, and a Pod can
# name only a Secret of its own namespace, so cella-workloads holds its own
# copy, `ghcr-pull`, which is also the name CELLA_K8S_IMAGE_PULL_SECRETS puts
# on every sandbox Pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: cella-workloads
imagePullSecrets:
  - name: ghcr-pull
---
# The accesses of runtime/k8s's `verbs` table, in the one namespace the
# driver writes in, and nothing else. A Secret per sandbox carries its
# workload token, its environment values and its gateway credential, and its
# Pod reads every variable from it: no claim or Pod carries a value. A
# headless Service and a NetworkPolicy per mesh
# admit peers to each other; the egress boundary stays the gateway's. The
# retired hosted Role's `cilium.io/ciliumnetworkpolicies` is not here: the
# driver writes no Cilium object.
#
# `watch` is not here either. The driver lists and gets; it opens no watch.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cellad-workloads
  namespace: cella-workloads
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete", "patch"]
  # Commands, terminals and file transfers open the exec subresource over a
  # WebSocket, which the API server authorizes as get (and from 1.35 as
  # create as well), and fall back to the SPDY upgrade, a create.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # A sandbox's declared ports, reached through port forwarding: get for the
  # WebSocket session, create for the SPDY upgrade. The kubelet connects inside
  # the sandbox Pod, so no NetworkPolicy admits the control plane to it.
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete"]
  # Sizing a sandbox inside the ceiling its manifest names
  # (spec.resources.max): the driver raises a running container's memory
  # through the Pod's resize subresource, and decides to from the working set
  # the metrics API serves, read for the Pods of this namespace alone. The
  # driver reviews both at start; with either missing it declares no memory
  # autosize and every sandbox keeps the size it was created at.
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["patch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cellad-workloads
  namespace: cella-workloads
# The subject is the control plane's account in `latere`; the Role and this
# binding stay in cella-workloads, so the grant reaches that namespace alone.
subjects:
  - kind: ServiceAccount
    name: cellad
    namespace: latere
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cellad-workloads
---
# The one cluster-scoped read the driver makes: Preflight gets the storage
# class named in CELLA_K8S_STORAGE_CLASS, so a misspelled class is a start-up
# failure and not a claim that never binds. StorageClass is cluster scoped and
# cannot be reached by a Role, so this is a ClusterRole narrowed to the one
# class by name. The hosted tree granted get, list and update on `nodes`
# cluster-wide for its warm pool; nothing here needs a node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cellad-storageclass
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
    resourceNames: ["cella-block-storage"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cellad-storageclass
subjects:
  - kind: ServiceAccount
    name: cellad
    namespace: latere
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cellad-storageclass
