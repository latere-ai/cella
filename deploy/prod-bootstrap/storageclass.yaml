# The class every sandbox workspace claim is provisioned from, named in
# CELLA_K8S_STORAGE_CLASS.
#
# reclaimPolicy: Delete, so deleting a claim deletes the volume behind it.
# Deleting a sandbox namespace expects the volumes to go with it; a class
# edited to Retain leaves them behind and they are removed by hand.
#
# volumeBindingMode: WaitForFirstConsumer, not Immediate. Immediate suits a
# warm pool, which provisions a claim before any Pod asks for one. The driver
# of cella spec 036 declares no Pool capability and creates the claim and the
# Pod in one call, so binding at the first consumer provisions the volume on
# the node the Pod was scheduled to and costs nothing. It also removes any
# assumption about which zone a volume is in.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cella-block-storage
provisioner: dobs.csi.digitalocean.com
parameters:
  type: ext4
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
