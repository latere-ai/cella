#
# The identity the release pipeline deploys with. It is bounded twice: to
# the `latere` namespace, and to the kinds `deploy/prod` contains. It can
# apply those objects, roll the Deployments, and read the result. It holds
# no grant on Secrets or Namespaces, no delete, no Role or RoleBinding, and
# nothing outside this namespace.
#
# The bound is per namespace, not per service: anything that can change a
# pod template can mount any Secret in that namespace. What a per-service
# identity adds is attribution in the audit log and revocation that does
# not touch another service's pipeline.
#
# The pipeline reads a kubeconfig built from this account's token out of
# the `CELLA_KUBECONFIG` repository secret. `deploy/prod-bootstrap` is never
# applied by a pipeline, so the identity cannot widen its own grant; a
# kind added to `deploy/prod` is added here and applied by an operator.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cellad-rollout
  namespace: latere
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cellad-rollout
  namespace: latere
rules:
  # `kubectl apply` reads each object before it writes it and patches the
  # Deployments to the image digest the release pinned.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "create", "update", "patch"]
  # `rollout status` gets each Deployment, then lists and watches it by
  # name, and reads the rollout's state from its status alone.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cellad-rollout
  namespace: latere
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cellad-rollout
subjects:
  - kind: ServiceAccount
    name: cellad-rollout
    namespace: latere
---
# A ServiceAccount no longer mints a long-lived token on its own, and a
# pipeline cannot refresh a short one, so the token is a Secret bound to
# the account. It is the only credential this identity has; deleting the
# Secret revokes it.
apiVersion: v1
kind: Secret
metadata:
  name: cellad-rollout-token
  namespace: latere
  annotations:
    kubernetes.io/service-account.name: cellad-rollout
type: kubernetes.io/service-account-token
