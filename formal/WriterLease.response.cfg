\* expect violation: Exclusive
\* The deadline measured from the response, as the code did before: a slow
\* answer lets the holder write past the expiry the store recorded, and a
\* standby that takes the lease then writes beside it.
CONSTANTS
  Replicas = {1, 2}
  Horizon = 40
  MaxDelay = 4
  FromResponse = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Exclusive
