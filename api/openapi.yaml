# The /v1 surface of cellad, as design 008 states it.
#
# This document is carried in the repository and served at /openapi.yaml under
# no bearer. internal/api holds it to the routes the server registers, in both
# directions: a route with no operation here and an operation with no route
# both fail the build. The field schemas of each kind are generated from the Go
# types by the generator design 008 names, which is not built; what this
# document fixes today is the surface, the parameters and the error envelope.
openapi: 3.1.0
info:
  title: Cella control plane
  summary: The declarative API that creates, drives and observes sandboxes.
  version: v1beta1
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: The control plane this document was served from.
security:
  - bearer: []
paths:
  /v1/sandboxes:
    post:
      operationId: createSandbox
      summary: Create a sandbox from a manifest.
      description: Authorized as `sandbox.create`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listSandboxes
      summary: List the caller's sandboxes.
      description: Authorized as `sandbox.list`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The object's name, which the apply writes under.
        schema:
          type: string
    put:
      operationId: applySandbox
      summary: Apply a sandbox by name.
      description: >-
        A create when the name is free and an update when the caller holds it.
        A body naming another object is refused at metadata.name.
        Authorized as `sandbox.create` or `sandbox.update`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: readSandbox
      summary: Read one sandbox with its status.
      description: Authorized as `sandbox.read`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSandbox
      summary: Delete one sandbox; accepted in every phase.
      description: Authorized as `sandbox.delete`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/start:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: startSandbox
      summary: Start a stopped sandbox.
      description: Authorized as `sandbox.update`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/stop:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: stopSandbox
      summary: Stop a running sandbox and keep its workspace.
      description: Authorized as `sandbox.update`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/exec:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: execSandbox
      summary: "Run a command: the framed exec stream, or one JSON result with wait=1."
      description: Authorized as `sandbox.exec`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: execSocket
      summary: Open the exec WebSocket, for a command with input or a terminal.
      description: Authorized as `sandbox.exec`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/attach:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: attachSandbox
      summary: Open the attach WebSocket, which carries a pseudo-terminal.
      description: Authorized as `sandbox.exec`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/dial/{port}:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
      - name: port
        in: path
        required: true
        description: The port inside the sandbox.
        schema:
          type: integer
    get:
      operationId: dialSandbox
      summary: Open a raw byte stream to a port inside the sandbox.
      description: >-
        A WebSocket, subprotocol `cella.dial.v1`, whose binary frames are the
        connection's bytes both ways. It closes with 1000 when the inside
        closes and with 1011 and the error's code when the dial fails. Needs
        `Dial`. Authorized as `sandbox.exec`.
      responses:
        "101":
          description: The socket is open.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/files:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: exportFiles
      summary: Read the named paths as one tar stream.
      description: >-
        Authorized as `sandbox.exec`. Every path is absolute and at or below
        the sandbox's workspace. A failure after the first byte ends the
        stream and names the error in the `X-Cella-Error` trailer.
      parameters:
        - name: path
          in: query
          required: true
          description: A path to include; repeat it for more than one.
          schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: The archive.
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: importFiles
      summary: Write one file, or extract a tar archive under a destination.
      description: >-
        Authorized as `sandbox.exec`. With `path` the body is one file's
        bytes. With `dest` the body is a tar archive, sent as
        `application/x-tar`, extracted below that directory. The two are
        exclusive.
      parameters:
        - name: path
          in: query
          required: false
          description: The file to write, at or below the sandbox's workspace.
          schema:
          type: string
        - name: dest
          in: query
          required: false
          description: The directory an archive is extracted below, at or below the sandbox's workspace.
          schema:
            type: string
        - name: mode
          in: query
          required: false
          description: The written file's permission bits as octal text, at most `0777`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-tar:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Written.
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeFile
      summary: Remove a file or a directory tree.
      description: Authorized as `sandbox.exec`.
      parameters:
        - name: path
          in: query
          required: true
          description: The file or directory to remove, below the sandbox's workspace.
          schema:
          type: string
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/files/content:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: readFile
      summary: Read one file's body.
      description: Authorized as `sandbox.exec`.
      parameters:
        - name: path
          in: query
          required: true
          description: The file to read, at or below the sandbox's workspace.
          schema:
          type: string
      responses:
        "200":
          description: The file's bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/files/stat:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: statFile
      summary: Read one entry.
      description: Authorized as `sandbox.exec`.
      parameters:
        - name: path
          in: query
          required: true
          description: The entry to read, at or below the sandbox's workspace.
          schema:
          type: string
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileInfo"
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/files/list:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: listFiles
      summary: List a directory's immediate entries, sorted by name.
      description: Authorized as `sandbox.exec`.
      parameters:
        - name: path
          in: query
          required: true
          description: The directory to list, at or below the sandbox's workspace.
          schema:
          type: string
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileInfo"
                  next:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/files/mkdir:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: makeDirectory
      summary: Make a directory and its missing parents.
      description: Authorized as `sandbox.exec`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: The directory to make, below the sandbox's workspace.
      responses:
        "204":
          description: Made.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/files/move:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: moveFile
      summary: Move a file or a directory to an exact destination.
      description: Authorized as `sandbox.exec`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  description: The path to move, below the sandbox's workspace.
                to:
                  type: string
                  description: The exact destination, below the sandbox's workspace.
      responses:
        "204":
          description: Moved.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/logs:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: sandboxLogs
      summary: Read the main process output, following it with follow=1.
      description: Authorized as `sandbox.read`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/egress:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: sandboxEgress
      summary: List the connections the gateway reported for this sandbox.
      description: Authorized as `sandbox.read`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/display:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: sandboxDisplay
      summary: Read the desktop geometry and whether it is up.
      description: Authorized as `sandbox.read`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/screenshot:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: sandboxScreenshot
      summary: Read one frame of the desktop.
      description: Authorized as `sandbox.exec`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/screen:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: sandboxScreen
      summary: Open the screen WebSocket, which carries frames.
      description: Authorized as `sandbox.exec`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/input:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: sandboxInput
      summary: Run one batch of input events on the desktop.
      description: Authorized as `sandbox.exec`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/ports:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: sandboxPorts
      summary: List each declared port with the driver's probe of it.
      description: Authorized as `sandbox.read`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/ports/{name}/{path}:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
      - name: name
        in: path
        required: true
        description: The name of a port the sandbox declares.
        schema:
          type: string
      - name: path
        in: path
        required: true
        description: The path the server inside receives, which may hold several segments.
        schema:
          type: string
    get:
      operationId: proxyPortGet
      summary: Forward a GET request to a declared port.
      description: &proxyDescription >-
        An HTTP proxy to the port the sandbox declares under `name`, reached
        through the driver's `Dial`. The path suffix, the query, the headers
        but the hop-by-hop set and `Authorization`, and the body are
        forwarded, and a WebSocket upgrade passes through. An undeclared name
        is `not_found`; a port nothing listens on, or a sandbox that is not
        running, is 502 `upstream_unavailable`. Needs `Dial`. Authorized as
        `sandbox.exec`.
      responses:
        "200":
          description: The answer the server inside the sandbox gave.
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: proxyPortPut
      summary: Forward a PUT request to a declared port.
      description: *proxyDescription
      responses:
        "200":
          description: The answer the server inside the sandbox gave.
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: proxyPortPost
      summary: Forward a POST request to a declared port.
      description: *proxyDescription
      responses:
        "200":
          description: The answer the server inside the sandbox gave.
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: proxyPortDelete
      summary: Forward a DELETE request to a declared port.
      description: *proxyDescription
      responses:
        "200":
          description: The answer the server inside the sandbox gave.
        default:
          $ref: "#/components/responses/Error"
    options:
      operationId: proxyPortOptions
      summary: Forward a OPTIONS request to a declared port.
      description: *proxyDescription
      responses:
        "200":
          description: The answer the server inside the sandbox gave.
        default:
          $ref: "#/components/responses/Error"
    head:
      operationId: proxyPortHead
      summary: Forward a HEAD request to a declared port.
      description: *proxyDescription
      responses:
        "200":
          description: The answer the server inside the sandbox gave.
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: proxyPortPatch
      summary: Forward a PATCH request to a declared port.
      description: *proxyDescription
      responses:
        "200":
          description: The answer the server inside the sandbox gave.
        default:
          $ref: "#/components/responses/Error"
    trace:
      operationId: proxyPortTrace
      summary: Forward a TRACE request to a declared port.
      description: *proxyDescription
      responses:
        "200":
          description: The answer the server inside the sandbox gave.
        default:
          $ref: "#/components/responses/Error"
  /v1/events:
    get:
      operationId: objectEvents
      summary: Read one object's events, newest first, or follow them as they happen with follow=1.
      description: >-
        Without `follow`, one page of the object's records, newest first, and
        the cursor of the next older page in `next`. Authorized as the
        object's own kind's read.


        With `follow=1` and `object`, the object's records with a `seq` above
        `cursor`, oldest first, and then each new one as it is committed, as
        newline-delimited JSON. `cursor` is the newest `seq` the caller
        holds, which is `items[0].seq` of a page and not its `next`; without
        it the feed starts from now. The feed ends after the object's
        `*.deleted` record. A cursor whose next record the server no longer
        keeps is 410 `cursor_expired`; one above the newest `seq` is
        `invalid_field`.


        With `follow=1` and no `object`, every record the caller may read,
        from now, filtered one record at a time as the list routes filter
        one object at a time. Opened under `sandbox.list`; `cursor` is
        refused. On a server with more than one replica it carries the
        records of the replica that serves it.


        A following feed writes one record per line, an empty line every 15
        seconds while it has nothing to send, and, where it ends on a
        failure, one last line holding the refusal envelope. It ends without
        a line when the server shuts down; a caller reconnects with the
        newest `seq` it holds. A process serves at most 256 following feeds
        at once and refuses the next with 429 `rate_limited`.
      parameters:
        - name: object
          in: query
          description: The object's prefixed identifier; an environment's name. Required for a page.
          schema:
            type: string
        - name: cursor
          in: query
          description: For a page, the `next` of the previous page. For a follow, the newest `seq` the caller holds.
          schema:
            type: string
        - name: limit
          in: query
          description: The records one page holds, 1 to 200; 50 when absent. A follow does not read it.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: follow
          in: query
          description: 1 follows the feed; 0 or absent reads a page.
          schema:
            type: string
            enum: ["0", "1"]
      responses:
        "200":
          description: A page, or with follow=1 a following feed.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  next:
                    type: string
            application/x-ndjson:
              schema:
                type: string
                description: One record per line, an empty line as a heartbeat, and a refusal envelope as the last line of a feed that ended on a failure.
        default:
          $ref: "#/components/responses/Error"
  /v1/secrets:
    post:
      operationId: createSecret
      summary: Create a secret from a manifest.
      description: Authorized as `secret.create`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listSecrets
      summary: List the caller's secrets; no answer carries a value.
      description: Authorized as `secret.list`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/secrets/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The object's name, which the apply takes as the object it writes.
        schema:
          type: string
    put:
      operationId: applySecret
      summary: Apply a secret by name; a second apply rotates the value in place.
      description: Authorized as `secret.create or secret.update`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: readSecret
      summary: Read one secret without its value.
      description: Authorized as `secret.read`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSecret
      summary: Delete one secret.
      description: Authorized as `secret.delete`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/environments:
    get:
      operationId: listEnvironments
      summary: List the environments this control plane holds.
      description: Authorized as `environment.list`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createEnvironment
      summary: Create an environment from a manifest.
      description: >-
        The name is the environment's id, and a taken name is refused.
        Authorized as `environment.create`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/environments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: readEnvironment
      summary: Read one environment with its capabilities.
      description: Authorized as `environment.read`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: applyEnvironment
      summary: Apply an environment by name.
      description: >-
        A create when the name is free and an update when it is held. The
        answer carries an ETag, and an If-Match that names an older version is
        refused with version_conflict. Authorized as `environment.create` or
        `environment.update`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteEnvironment
      summary: Delete an environment no sandbox is placed on.
      description: >-
        The environment this control plane drives itself is not deletable.
        Authorized as `environment.delete`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/environments/{id}/keys:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: mintEnvironmentKey
      summary: Mint an environment key, shown once.
      description: Authorized as `environment.key`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/environments/{id}/keys/{jti}:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
      - name: jti
        in: path
        required: true
        description: The key's identifier, as the mint returned it.
        schema:
          type: string
    delete:
      operationId: revokeEnvironmentKey
      summary: Revoke one environment key by its identifier.
      description: Authorized as `environment.key`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/environments/{id}/workers:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: registerWorker
      summary: Register a worker for an environment; environment key only.
      description: Authorized as `none beyond the key`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/environments/{id}/operations:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: workerOperations
      summary: Open the worker operations WebSocket; environment key only.
      description: Authorized as `none beyond the key`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/environments/{id}/egress:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: gatewaySync
      summary: Open the gateway sync WebSocket; environment key only.
      description: Authorized as `none beyond the key`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A token from a configured issuer, a sandbox's own workload token, or,
        on the worker routes alone, an environment key.
  responses:
    Error:
      description: "The refusal envelope of design 008: one code, one fixed sentence."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    FileInfo:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        size:
          type: integer
          format: int64
        mode:
          type: integer
          description: The permission and type bits.
        modTime:
          type: string
          format: date-time
        isDir:
          type: boolean
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: The row of the error table this refusal is.
            message:
              type: string
              description: The fixed sentence that row carries, for the person who asked.
            details:
              type: object
              description: >-
                The developer half: request_id on every refusal, paths where the
                code names fields, and detail for the developer sentence.
              properties:
                request_id:
                  type: string
                detail:
                  type: string
                paths:
                  type: array
                  items:
                    type: string
