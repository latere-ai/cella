  /v1/events:
    get:
      operationId: objectEvents
      summary: Read or follow events
      description: >-
        Read one object's events, newest first, or follow them as they happen
        with follow=1.


        Without `follow`, one page of the object's records, newest first, and
        the cursor of the next older page in `next`. Authorized as the
        object's own kind's read.


        With `follow=1` and `object`, the object's records with a `seq` above
        `cursor`, oldest first, and then each new one as it is committed, as
        newline-delimited JSON. `cursor` is the newest `seq` the caller
        holds, which is `items[0].seq` of a page and not its `next`; without
        it the feed starts from now. The feed ends after the object's
        `*.deleted` record. A cursor whose next record the server no longer
        keeps is 410 `cursor_expired`; one above the newest `seq` is
        `invalid_field`.


        With `follow=1` and no `object`, every record the caller may read,
        from now, filtered one record at a time as the list routes filter
        one object at a time. Opened under `sandbox.list`; `cursor` is
        refused. On a server with more than one replica it carries the
        records of the replica that serves it.


        A following feed writes one record per line, an empty line every 15
        seconds while it has nothing to send, and, where it ends on a
        failure, one last line holding the refusal envelope. It ends without
        a line when the server shuts down; a caller reconnects with the
        newest `seq` it holds. A process serves at most 256 following feeds
        at once and refuses the next with 429 `rate_limited`.
      parameters:
        - name: object
          in: query
          description: The object's prefixed identifier; an environment's name. Required for a page.
          schema:
            type: string
        - name: cursor
          in: query
          description: For a page, the `next` of the previous page. For a follow, the newest `seq` the caller holds.
          schema:
            type: string
        - name: limit
          in: query
          description: The records one page holds, 1 to 200; 50 when absent. A follow does not read it.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: follow
          in: query
          description: 1 follows the feed; 0 or absent reads a page.
          schema:
            type: string
            enum: ["0", "1"]
      responses:
        "200":
          description: A page, or with follow=1 a following feed.
          content:
            application/json:
              example:
                items:
                  - id: evt_example2
                    seq: 2
                    type: sandbox.started
                    time: "2026-09-22T12:00:01Z"
                    object:
                      kind: Sandbox
                      id: sbx_example
                      name: work
                      owner: "https://issuer.example.com|alice"
                    subject: "https://issuer.example.com|alice"
                    requestId: req_example
                    reason: Request
                    data:
                      phase: Running
                next: "2"
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  next:
                    type: string
            application/x-ndjson:
              example: |
                {"id":"evt_example1","seq":1,"type":"sandbox.created","time":"2026-09-22T12:00:00Z","object":{"kind":"Sandbox","id":"sbx_example","name":"work","owner":"https://issuer.example.com|alice"},"subject":"https://issuer.example.com|alice","requestId":"req_example","data":{"environment":"default","workdir":"/workspace","workspace":{"path":"/workspace","source":"empty"}}}
                {"id":"evt_example2","seq":2,"type":"sandbox.started","time":"2026-09-22T12:00:01Z","object":{"kind":"Sandbox","id":"sbx_example","name":"work","owner":"https://issuer.example.com|alice"},"subject":"https://issuer.example.com|alice","requestId":"req_example","reason":"Request","data":{"phase":"Running"}}
              schema:
                type: string
                description: One record per line, an empty line as a heartbeat, and a refusal envelope as the last line of a feed that ended on a failure.
        default:
          $ref: "#/components/responses/Error"
  /v1/secrets:
    post:
      operationId: createSecret
      summary: Create a secret
      description: >-
        Create a secret from a manifest. Authorized as `secret.create`.
      requestBody:
        required: true
        content:
          application/json:
            example: &secretManifest
              apiVersion: cella.latere.ai/v1beta1
              kind: Secret
              metadata: &secretMetadata
                name: api-key
              spec:
                scope:
                  hosts: [api.example.com]
                value: example-value
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example: &secret
                apiVersion: cella.latere.ai/v1beta1
                kind: Secret
                metadata: *secretMetadata
                spec: &secretSpec
                  kind: static
                  scope:
                    hosts: [api.example.com]
                    ports: [443]
                  inject:
                    header: Authorization
                    scheme: bearer
                status:
                  id: sec_example
                  owner: "https://issuer.example.com|alice"
                  version: 1
                  createdAt: "2026-09-22T12:00:00Z"
                  updatedAt: "2026-09-22T12:00:00Z"
                  mountedBy: 0
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listSecrets
      summary: List secrets
      description: >-
        List the caller's secrets; no answer carries a value. Answers
        `{"items": [...], "next": "..."}`. `owner` and `label` are intersected
        with what the caller may read, so naming another subject's owner
        answers only what the caller could already read of that subject's
        secrets, and a selector outside it is an empty page, never
        `forbidden`. Authorized as `secret.list`.
      parameters:
        - $ref: "#/components/parameters/ListLabel"
        - $ref: "#/components/parameters/ListOwner"
        - $ref: "#/components/parameters/ListCursor"
        - $ref: "#/components/parameters/ListLimit"
      responses:
        "200":
          description: One page of secrets, each without its value.
          content:
            application/json:
              example:
                items:
                  - *secret
                next: ""
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Secret"
                  next:
                    type: string
                    description: The cursor of the next page; empty on the last.
        default:
          $ref: "#/components/responses/Error"
  /v1/secrets/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The object's name, which the apply takes as the object it writes.
        schema:
          type: string
    put:
      operationId: applySecret
      summary: Apply a secret
      description: >-
        Apply a secret by name; a second apply rotates the value in place.
        Authorized as `secret.create or secret.update`.
      requestBody:
        required: true
        content:
          application/json:
            example: *secretManifest
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example:
                apiVersion: cella.latere.ai/v1beta1
                kind: Secret
                metadata: *secretMetadata
                spec: *secretSpec
                status:
                  id: sec_example
                  owner: "https://issuer.example.com|alice"
                  version: 2
                  createdAt: "2026-09-22T12:00:00Z"
                  updatedAt: "2026-09-22T12:30:00Z"
                  mountedBy: 0
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: readSecret
      summary: Read a secret
      description: >-
        Read one secret without its value. Authorized as `secret.read`.
      responses:
        "200":
          description: The secret, without its value.
          content:
            application/json:
              example: *secret
              schema:
                $ref: "#/components/schemas/Secret"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSecret
      summary: Delete a secret
      description: Delete one secret. Authorized as `secret.delete`.
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example: *secret
        default:
          $ref: "#/components/responses/Error"
  /v1/environments:
