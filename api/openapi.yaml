                        snapshots: false
                        attach: true
                        dial: true
                        display: false
                        input: false
                        resize: false
                        pool: true
                        files: true
                        detach: false
                      version: 1
                      createdAt: "2026-09-22T12:00:00Z"
                      updatedAt: "2026-09-22T12:00:00Z"
