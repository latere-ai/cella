        A 307 whose Location is relative: the port's name as the request
        escaped it and a slash, then the query when there is one, written
        after `./` when the name holds a colon. It resolves against the path
        the client asked for, so a client that reached this server through a
        proxy serving it under another prefix stays under that prefix. 307
        keeps the method and the body. Nothing is read and nothing is asked;
        the path it points at is authorized as `sandbox.exec`.
      responses:
        "307":
          description: The port's path with its trailing slash, in the Location header.
          headers:
            Location:
              description: The relative reference the client follows.
              schema:
                type: string
