# The /v1 surface of cellad, as design 008 states it.
#
# This document is carried in the repository and served at /openapi.yaml under
# no bearer. A control plane served under a base path, CELLA_BASE_PATH, serves
# it under that path, and each path below then carries the base in the place of
# /v1: /v1/sandboxes is served as /v1/environments/sandboxes under the base
# /v1/environments. internal/api holds it to the routes the server registers, in both
# directions: a route with no operation here and an operation with no route
# both fail the build. The field schemas of each kind are generated from the Go
# types by the generator design 008 names, which is not built; what this
# document fixes today is the surface, the parameters and the error envelope.
openapi: 3.1.0
info:
  title: Cella control plane
  summary: The declarative API that creates, drives and observes sandboxes.
  version: v1beta1
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: >-
      The control plane this document was served from. Under a base path the
      paths below carry the base in the place of /v1, as the control plane
      serves them.
security:
  - bearer: []
paths:
  /v1/sandboxes:
    post:
      operationId: createSandbox
      summary: Create a sandbox
      description: >-
        Create a sandbox from a manifest. Answers 201 with `Location` and the
        sandbox as soon as it is recorded, in phase `Pending`, before its
        workload runs; the control plane then brings it to `Running`, or to
        `Failed` with its reason. A sandbox adopted from the environment's
        pool answers after the adoption, and one a queued environment cannot
        place yet answers `Queued`. With `wait=1` the answer is held until the
        sandbox has left `Queued`, `Pending` and `Starting`, for at most
        `timeout`. A boundary that needs an egress gateway while none is
        connected is refused with `egress_gateway_unavailable`. Authorized as
        `sandbox.create`.
      parameters:
        - $ref: "#/components/parameters/Wait"
        - $ref: "#/components/parameters/WaitTimeout"
      requestBody:
        required: true
        content:
          application/json:
            example: &sandboxManifest
              apiVersion: cella.latere.ai/v1beta1
              kind: Sandbox
              metadata: &sandboxMetadata
                name: work
              spec: {}
      responses:
        "201":
          description: The sandbox as recorded, or as it stands when a held answer ends.
          content:
            application/json:
              example: &sandboxPending
                apiVersion: cella.latere.ai/v1beta1
                kind: Sandbox
                metadata: *sandboxMetadata
                spec: &sandboxSpec
                  environment: default
                  workdir: /workspace
                  workspace:
                    path: /workspace
                    source: empty
                  network:
                    egress:
                      mode: open
                status:
                  id: sbx_example
                  owner: "https://issuer.example.com|alice"
                  environment: default
                  driver: native
                  isolation: none
                  phase: Pending
                  root: sbx_example
                  createdAt: "2026-09-22T12:00:00Z"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listSandboxes
      summary: List sandboxes
      description: >-
        List the caller's sandboxes. Answers
        `{"items": [...], "next": "..."}`. Every selector is intersected with
        what the caller may read, so a selector outside it is an empty page
        and never `forbidden`. Authorized as `sandbox.list`.
      parameters:
        - $ref: "#/components/parameters/ListLabel"
        - $ref: "#/components/parameters/ListOwner"
        - name: phase
          in: query
          required: false
          description: Keeps the sandboxes in this phase.
          schema:
            type: string
        - name: environment
          in: query
          required: false
          description: Keeps the sandboxes placed on this environment.
          schema:
            type: string
        - name: root
          in: query
          required: false
          description: Keeps one spawn tree, the root with every sandbox below it.
          schema:
            type: string
        - $ref: "#/components/parameters/ListCursor"
        - $ref: "#/components/parameters/ListLimit"
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example:
                items:
                  - &sandboxRunning
                    apiVersion: cella.latere.ai/v1beta1
                    kind: Sandbox
                    metadata: *sandboxMetadata
                    spec: *sandboxSpec
                    status:
                      id: sbx_example
                      owner: "https://issuer.example.com|alice"
                      environment: default
                      driver: native
                      isolation: none
                      phase: Running
                      root: sbx_example
                      conditions: &sandboxConditions
                        - type: EgressEnforced
                          status: "False"
                          reason: NotEnforcedByDriver
                          message: This environment records the boundary and does not confine the workload to it.
                          since: "2026-09-22T12:00:00Z"
                        - type: Scheduled
                          status: "True"
                          reason: Placed
                          since: "2026-09-22T12:00:00Z"
                      createdAt: "2026-09-22T12:00:00Z"
                      startedAt: "2026-09-22T12:00:01Z"
                      lastActivityAt: "2026-09-22T12:00:01Z"
                next: ""
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The object's name, which the apply writes under.
        schema:
          type: string
    put:
      operationId: applySandbox
      summary: Apply a sandbox
      description: >-
        Apply a sandbox by name. A create when the name is free and an update
        when the caller holds it. A body naming another object is refused at
        metadata.name. A create answers 201 as `POST /v1/sandboxes` does, and
        an update 200; `wait=1` holds either answer the same way. Authorized
        as `sandbox.create` or `sandbox.update`.
      parameters:
        - $ref: "#/components/parameters/Wait"
        - $ref: "#/components/parameters/WaitTimeout"
      requestBody:
        required: true
        content:
          application/json:
            example: *sandboxManifest
      responses:
        "200":
          description: The sandbox the update left.
          content:
            application/json:
              example: *sandboxRunning
        "201":
          description: The sandbox the create recorded.
          content:
            application/json:
              example: *sandboxPending
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: readSandbox
      summary: Read a sandbox
      description: >-
        Read one sandbox with its status. Authorized as `sandbox.read`.
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example: *sandboxRunning
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSandbox
      summary: Delete a sandbox
      description: >-
        Delete one sandbox; accepted in every phase. Authorized as
        `sandbox.delete`.
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example:
                apiVersion: cella.latere.ai/v1beta1
                kind: Sandbox
                metadata: *sandboxMetadata
                spec: *sandboxSpec
                status:
                  id: sbx_example
                  owner: "https://issuer.example.com|alice"
                  environment: default
                  driver: native
                  isolation: none
                  phase: Deleting
                  root: sbx_example
                  conditions: *sandboxConditions
                  createdAt: "2026-09-22T12:00:00Z"
                  startedAt: "2026-09-22T12:00:01Z"
                  lastActivityAt: "2026-09-22T12:00:01Z"
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/start:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: startSandbox
      summary: Start a sandbox
      description: Start a stopped sandbox. Authorized as `sandbox.update`.
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example: *sandboxRunning
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/stop:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: stopSandbox
      summary: Stop a sandbox
      description: >-
        Stop a running sandbox and keep its workspace. Authorized as
        `sandbox.update`.
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example:
                apiVersion: cella.latere.ai/v1beta1
                kind: Sandbox
                metadata: *sandboxMetadata
                spec: *sandboxSpec
                status:
                  id: sbx_example
                  owner: "https://issuer.example.com|alice"
                  environment: default
                  driver: native
                  isolation: none
                  phase: Stopped
                  root: sbx_example
                  conditions: *sandboxConditions
                  createdAt: "2026-09-22T12:00:00Z"
                  startedAt: "2026-09-22T12:00:01Z"
                  stoppedAt: "2026-09-22T12:30:00Z"
                  lastActivityAt: "2026-09-22T12:29:00Z"
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/exec:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: execSandbox
      summary: Run a command
      description: >-
        Run a command: the framed exec stream, or one JSON result with wait=1.
        Authorized as `sandbox.exec`.
      requestBody:
        required: true
        content:
          application/json:
            example:
              command: [sh, -c, echo hello]
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example:
                exitCode: 0
                stdout: "hello\n"
                stderr: ""
                truncated: false
                durationMs: 6
            application/vnd.cella.exec-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: execSocket
      summary: Open the exec socket
      description: >-
        Open the exec WebSocket, for a command with input or a terminal. Once
        upgraded, the first text frame is the JSON request, binary frames
        carry the command's input and output, a text frame
        `{"resize": {"cols": 120, "rows": 40}}` resizes a terminal, and the
        last text frame is `{"exit": 0}` with the exit code, or
        `{"error": {...}}` with the refusal envelope. Authorized as
        `sandbox.exec`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/attach:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: attachSandbox
      summary: Open the attach socket
      description: >-
        Open the attach WebSocket, which carries a pseudo-terminal. Once
        upgraded, the first text frame is the JSON request, binary frames
        carry the terminal's bytes both ways, a text frame
        `{"resize": {"cols": 120, "rows": 40}}` resizes it, and the last text
        frame is `{"exit": 0}` with the exit code, or `{"error": {...}}` with
        the refusal envelope. Authorized as `sandbox.exec`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/dial/{port}:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
      - name: port
        in: path
        required: true
        description: The port inside the sandbox.
        schema:
          type: integer
    get:
      operationId: dialSandbox
      summary: Dial a port
      description: >-
        Open a raw byte stream to a port inside the sandbox. A WebSocket,
        subprotocol `cella.dial.v1`, whose binary frames are the connection's
        bytes both ways. It closes with 1000 when the inside closes and with
        1011 and the error's code when the dial fails. Needs `Dial`.
        Authorized as `sandbox.exec`.
      responses:
        "101":
          description: The socket is open.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/files:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: exportFiles
      summary: Read files as tar
      description: >-
        Read the named paths as one tar stream. Authorized as `sandbox.exec`.
        Every path is absolute and at or below the sandbox's workspace. A
        failure after the first byte ends the stream and names the error in
        the `X-Cella-Error` trailer.
      parameters:
        - name: path
          in: query
          required: true
          description: A path to include; repeat it for more than one.
          schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: The archive.
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: importFiles
      summary: Write files
      description: >-
        Write one file, or extract a tar archive under a destination.
        Authorized as `sandbox.exec`. With `path` the body is one file's
        bytes. With `dest` the body is a tar archive, sent as
        `application/x-tar`, extracted below that directory. The two are
        exclusive.
      parameters:
        - name: path
          in: query
          required: false
          description: The file to write, at or below the sandbox's workspace.
          schema:
          type: string
        - name: dest
          in: query
          required: false
          description: The directory an archive is extracted below, at or below the sandbox's workspace.
          schema:
            type: string
        - name: mode
          in: query
          required: false
          description: The written file's permission bits as octal text, at most `0777`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-tar:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Written.
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeFile
      summary: Remove a file
      description: >-
        Remove a file or a directory tree. Authorized as `sandbox.exec`.
      parameters:
        - name: path
          in: query
          required: true
          description: The file or directory to remove, below the sandbox's workspace.
          schema:
          type: string
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/files/content:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: readFile
      summary: Read a file
      description: Read one file's body. Authorized as `sandbox.exec`.
      parameters:
        - name: path
          in: query
          required: true
          description: The file to read, at or below the sandbox's workspace.
          schema:
          type: string
      responses:
        "200":
          description: The file's bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/files/stat:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: statFile
      summary: Read a file entry
      description: Read one entry. Authorized as `sandbox.exec`.
      parameters:
        - name: path
          in: query
          required: true
          description: The entry to read, at or below the sandbox's workspace.
          schema:
          type: string
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              example: &fileEntry
                name: notes.txt
                path: /workspace/notes.txt
                size: 6
                mode: "0644"
                modTime: "2026-09-22T12:00:00Z"
                isDir: false
              schema:
                $ref: "#/components/schemas/FileInfo"
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/files/list:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: listFiles
      summary: List a directory
      description: >-
        List a directory's immediate entries, sorted by name. Authorized as
        `sandbox.exec`.
      parameters:
        - name: path
          in: query
          required: true
          description: The directory to list, at or below the sandbox's workspace.
          schema:
          type: string
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              example:
                items:
                  - *fileEntry
                next: ""
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileInfo"
                  next:
                    type: string
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/files/mkdir:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: makeDirectory
      summary: Make a directory
      description: >-
        Make a directory and its missing parents. Authorized as
        `sandbox.exec`.
      requestBody:
        required: true
        content:
          application/json:
            example:
              path: /workspace/reports
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: The directory to make, below the sandbox's workspace.
      responses:
        "204":
          description: Made.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/files/move:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: moveFile
      summary: Move a file
      description: >-
        Move a file or a directory to an exact destination. Authorized as
        `sandbox.exec`.
      requestBody:
        required: true
        content:
          application/json:
            example:
              from: /workspace/notes.txt
              to: /workspace/reports/notes.txt
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  description: The path to move, below the sandbox's workspace.
                to:
                  type: string
                  description: The exact destination, below the sandbox's workspace.
      responses:
        "204":
          description: Moved.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/logs:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: sandboxLogs
      summary: Read logs
      description: >-
        Read the main process output, following it with follow=1. Authorized
        as `sandbox.read`.
      responses:
        "200":
          description: The answer this route serves.
          content:
            text/plain:
              example: |
                listening on port 8080
                GET /healthz 200
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/egress:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: sandboxEgress
      summary: List egress connections
      description: >-
        List the connections the gateway reported for this sandbox. Authorized
        as `sandbox.read`.
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example:
                items:
                  - principal: "sandbox:sbx_example"
                    at: "2026-09-22T12:00:05Z"
                    door: proxy
                    host: api.example.com
                    port: 443
                    decision: allowed
                    bytesOut: 512
                    bytesIn: 2048
                    durationMs: 120
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/display:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: sandboxDisplay
      summary: Read the desktop state
      description: >-
        Read the desktop geometry and whether it is up. Authorized as
        `sandbox.read`.
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example:
                width: 1280
                height: 800
                ready: true
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/screenshot:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: sandboxScreenshot
      summary: Take a screenshot
      description: Read one frame of the desktop. Authorized as `sandbox.exec`.
      responses:
        "200":
          description: The answer this route serves.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/screen:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: sandboxScreen
      summary: Open the screen socket
      description: >-
        Open the screen WebSocket, which carries frames. Once upgraded, each
        binary frame is one image of the desktop, PNG or JPEG as `format`
        names, at the pace `fps` names, from 1 to 10 frames a second.
        Authorized as `sandbox.exec`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/input:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: sandboxInput
      summary: Run input events
      description: >-
        Run one batch of input events on the desktop. Authorized as
        `sandbox.exec`.
      requestBody:
        required: true
        content:
          application/json:
            example:
              events:
                - type: move
                  x: 10
                  y: 20
                - type: click
                  button: left
                - type: type
                  text: hello
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example:
                executed: 3
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/ports:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: sandboxPorts
      summary: List declared ports
      description: >-
        List each declared port with the driver's probe of it. Authorized as
        `sandbox.read`.
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example:
                items:
                  - name: web
                    port: 8080
                    state: listening
                next: ""
        default:
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/ports/{name}/{path}:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
      - name: name
        in: path
        required: true
        description: The name of a port the sandbox declares.
        schema:
          type: string
      - name: path
        in: path
        required: true
        description: The path the server inside receives, which may hold several segments.
        schema:
          type: string
    get:
      operationId: proxyPortGet
      summary: Forward a GET request
      description: &proxyDescription >-
        An HTTP proxy to the port the sandbox declares under `name`, reached
        through the driver's `Dial`. The path suffix, the query, the headers
