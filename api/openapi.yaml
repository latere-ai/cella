  /v1/environments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: readEnvironment
      summary: Read an environment
      description: >-
        Read one environment with its capabilities. Authorized as
        `environment.read`.
      responses:
        "200":
          description: The answer this route serves.
