          $ref: "#/components/responses/Error"
  /v1/environments/{id}/keys:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: mintEnvironmentKey
      summary: Mint an environment key
      description: >-
        Mint an environment key, shown once. Authorized as `environment.key`.
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example:
                token: eyJ...example
                jti: &keyID "01EXAMPLE00000000000000000"
                exp: "2026-09-22T13:00:00Z"
        default:
          $ref: "#/components/responses/Error"
    get:
      operationId: listEnvironmentKeys
      summary: List environment keys
      description: >-
        List the keys minted for an environment, oldest first. One page of the
        environment's keys in the order they were minted: each key's `jti`,
        when it was minted, its `exp`, whether it is revoked and since when,
        and the subject that minted it. The token is never listed, because the
        control plane keeps no copy of it. A key stays listed until its `exp`
        passes. A control plane that signs no environment keys answers
        `capability_unsupported`. Authorized as `environment.key`.
      parameters:
        - name: cursor
          in: query
          description: The `next` of the previous page.
          schema:
            type: string
        - name: limit
          in: query
          description: The keys one page holds, 1 to 200; 50 when absent.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: One page of the environment's keys.
          content:
            application/json:
              example:
                items:
                  - jti: *keyID
                    mintedAt: "2026-09-22T12:00:00Z"
                    exp: "2026-09-22T13:00:00Z"
                    revoked: false
                    mintedBy: "https://issuer.example.com|admin"
                next: ""
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [jti, mintedAt, exp, revoked]
                      properties:
                        jti:
                          type: string
                          description: The key's identifier, which revokes it.
                        mintedAt:
                          type: string
                          format: date-time
                        exp:
                          type: string
                          format: date-time
                          description: When the key stops verifying, as the mint returned it.
                        revoked:
                          type: boolean
                        revokedAt:
                          type: string
                          format: date-time
                          description: Present on a revoked key.
                        mintedBy:
                          type: string
                          description: The rendered subject that minted the key.
                  next:
                    type: string
                    description: The cursor of the next page, empty on the last.
        default:
          $ref: "#/components/responses/Error"
  /v1/environments/{id}/keys/{jti}:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
      - name: jti
        in: path
        required: true
        description: The key's identifier, as the mint returned it.
        schema:
          type: string
    delete:
      operationId: revokeEnvironmentKey
      summary: Revoke an environment key
      description: >-
        Revoke one environment key by its identifier. Authorized as
        `environment.key`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/environments/{id}/workers:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    post:
      operationId: registerWorker
      summary: Register a worker
      description: >-
        Register a worker for an environment; environment key only. Authorized
        as `none beyond the key`.
      requestBody:
        required: true
        content:
          application/json:
            example:
              driver: podman
              isolation: container
              capabilities:
                files: true
      responses:
        "200":
          description: The answer this route serves.
          content:
            application/json:
              example:
                worker: wrk_example
                heartbeatInterval: 15s
                lease: 45s
                environment: default
        default:
          $ref: "#/components/responses/Error"
  /v1/environments/{id}/operations:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: workerOperations
      summary: Open the operations socket
      description: >-
        Open the worker operations WebSocket; environment key only. Once
        upgraded, subprotocol `cella.worker.v1`, every frame is a binary frame
        of that protocol, at most 1 MiB. Authorized as `none beyond the key`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
  /v1/environments/{id}/egress:
    parameters:
      - name: id
        in: path
        required: true
        description: The object's prefixed identifier, or a name among the caller's own.
        schema:
          type: string
    get:
      operationId: gatewaySync
      summary: Open the gateway socket
      description: >-
        Open the gateway sync WebSocket; environment key only. Once upgraded,
        each text frame is one JSON object of the `cella.egress.v1` protocol,
        named by its `type`: `hello`, `snapshot`, `put`, `purge`, `ack`,
        `heartbeat`, `record` or `use`. Authorized as `none beyond the key`.
      responses:
        "200":
          description: The answer this route serves.
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A token from a configured issuer, a sandbox's own workload token, or,
        on the worker routes alone, an environment key.
  parameters:
    Wait:
      name: wait
      in: query
      required: false
      description: >-
        `1` holds a create's answer until the sandbox has left `Queued`,
        `Pending` and `Starting`: it is `Running`, `Failed` with its reason,
        or in whatever phase its runtime reported after the create. A sandbox
        deleted while the answer is held answers `not_found`.
      schema:
        type: string
        enum: ["1"]
    WaitTimeout:
      name: timeout
      in: query
      required: false
      description: >-
        How long `wait=1` holds the answer, a duration such as `90s`, positive
        and at most `1h`, `10m` when absent; anything else is `invalid_field`.
        When it passes first the answer is the sandbox as it stands.
      schema:
        type: string
    ListLabel:
      name: label
      in: query
      required: false
      description: >-
        `key=value`, repeatable; an object is listed when it carries every
        one. Two that name one key with two values match nothing. A selector
        without `=` or without a key is `invalid_field`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    ListOwner:
      name: owner
      in: query
      required: false
      description: >-
        Keeps the objects of this owner, the rendered subject an object's
        `status.owner` carries.
      schema:
        type: string
    ListCursor:
      name: cursor
      in: query
      required: false
      description: The `next` of the previous page; absent for the first.
      schema:
        type: string
    ListLimit:
      name: limit
      in: query
      required: false
      description: The page size, 1 to 200, 50 when absent; anything else is `invalid_field`.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Error:
      description: "The refusal envelope of design 008: one code, one fixed sentence."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Secret:
      type: object
      description: >-
        A Secret as every answer carries it. `spec.value` is write-only and
        never present; the manifest reference describes every field of
        `spec`.
      properties:
        apiVersion:
          type: string
        kind:
          type: string
          enum: [Secret]
        metadata:
          type: object
          description: The name and the labels the owner gave it.
        spec:
          type: object
          description: The kind, the scope, the injection place and the oauth grant.
        status:
          $ref: "#/components/schemas/SecretStatus"
    SecretStatus:
      type: object
      required: [id, owner, version, createdAt, mountedBy]
      properties:
        id:
          type: string
          description: The secret's identifier, `sec_` and a ULID; it addresses the secret in every route.
        owner:
          type: string
          description: The subject that created it, `<issuer>|<sub>`.
        version:
          type: integer
          description: The version of the value, raised by every apply that carries one.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        mountedBy:
          type: integer
          description: How many sandboxes mount it and are not being deleted.
        lastUsedAt:
          type: string
          format: date-time
          description: >-
            When an egress gateway last substituted the value into a request,
            in UTC to the second. It moves at most once every 5 minutes, so
            the last substitution is at or after it and, unless a report was
            lost, less than 5 minutes after it. Absent on a secret no gateway
            has substituted.
    FileInfo:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        size:
          type: integer
          format: int64
        mode:
          type: integer
          description: The permission and type bits.
        modTime:
          type: string
          format: date-time
        isDir:
          type: boolean
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: The row of the error table this refusal is.
            message:
              type: string
              description: The fixed sentence that row carries, for the person who asked.
            details:
              type: object
              description: >-
                The developer half: request_id on every refusal, paths where the
                code names fields, and detail for the developer sentence.
              properties:
                request_id:
                  type: string
                detail:
                  type: string
                paths:
                  type: array
                  items:
                    type: string
