# The shared quality bar, read by `go tool lateregate`. The gates live in
# latere.ai/x/ci-gate, pinned in go.mod; only repository-specific values are
# here.

cover:
  trim_prefix: latere.ai/x/cella/

spec:
  archive:
    dir: .archive
    statuses: [complete, superseded]
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  started: [dispatched, in-progress, testing, complete]
  settled: [complete, superseded]
  require_section:
    - Overview
    - Design
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]

# Native execution and HTTP end-to-end tests run real sh, cat, and sleep
# commands (specs 025 and 028). Only the system tool directories join Go.
hermetic:
  allow: [/usr/bin, /bin]

# The Postgres suite of spec 010 starts a server in a container, and the
# container runtime writes its own state under TMPDIR. Those entries are the
# runtime's and outlive every run by design; nothing a test made survives.
tempdir:
  allow:
    podman: >-
      the container runtime's own state under TMPDIR, made when the Postgres
      suite of internal/store starts its server; it belongs to the runtime and
      not to a test, and outlives every run by design
    storage-run-501: >-
      the container runtime's per-user run directory, the same runtime state
      as above

# Spec 001's dependency rule: the build list of ./cmd/cellad reaches the
# standard library, latere.ai/x/pkg, the Kubernetes and Podman clients the
# drivers of spec 004 drive, the Postgres driver of spec 010, and the
# OpenTelemetry SDK, and no cloud SDK. Until those specs land the list is
# the standard library and pkg, so a new dependency is a decision
# recorded here, one row per role package as the roles land.
depcheck:
  packages:
    latere.ai/x/cella/cmd/cella:
      decision: >-
        the agent client of spec 011 reaches the standard library and the
        error envelope of latere.ai/x/pkg/httpjson, and nothing else: it runs
        where agents run, so every module in its build list is a module a
        sandbox image carries. The WebSocket of spec 008's exec and attach
        streams is this repository's own RFC 6455 implementation for the same
        reason, and the object shapes are manifest/v1, which is this module's
        own package and no dependency at all
      allow:
        latere.ai/x/pkg: the error envelope of spec 008, latere.ai/x/pkg/httpjson (spec 011)
        github.com/google/uuid: request ids in latere.ai/x/pkg/httpjson
    latere.ai/x/cella/cmd/cellad:
      decision: >-
        the server reaches latere.ai/x/pkg and the standard library, and
        the OpenTelemetry SDK with what it pulls in, which joined with
        spec 006 through the tracing transport the verifier and the
        authorizer client dial with; the Kubernetes client joins the list
        with spec 004, the Postgres driver with spec 010, and nothing
        else does without a row here (spec 001)
      allow:
        latere.ai/x/pkg: the shared library every Latere service is built on (spec 002)
        go.opentelemetry.io: >-
          the OpenTelemetry SDK spec 001 admits, reached through
          latere.ai/x/pkg/otel by the identity of spec 006: every
          outbound client this repository builds is instrumented
        google.golang.org/grpc: the OTLP exporters' transport, a dependency of the OpenTelemetry SDK
        google.golang.org/protobuf: the OTLP wire format, a dependency of the OpenTelemetry SDK
        google.golang.org/genproto: the OTLP status types, a dependency of the OpenTelemetry SDK
        golang.org/x: the Go project's extended library, a dependency of the OpenTelemetry SDK and gRPC
        github.com/grpc-ecosystem/grpc-gateway: the OTLP HTTP exporters' dependency
        github.com/go-logr: the OpenTelemetry SDK's logging seam
        github.com/google/uuid: request ids in latere.ai/x/pkg/httpjson
        github.com/felixge/httpsnoop: the response recorder of the SDK's HTTP instrumentation
        github.com/cespare/xxhash: a hash the OpenTelemetry SDK's metric pipeline uses
        github.com/cenkalti/backoff: the OTLP exporters' retry
        github.com/jackc/pgx: >-
          the Postgres driver and pool of spec 010, reached through
          internal/store/postgres: the durable store is what recovers a
          sandbox the data plane lost instead of forgetting it
        github.com/jackc/puddle: the connection pool github.com/jackc/pgx/v5/pgxpool is built on
        github.com/jackc/pgpassfile: the pgx driver's reader of the password file libpq defines
        github.com/jackc/pgservicefile: the pgx driver's reader of the service file libpq defines
        github.com/jackc/pgerrcode: the Postgres error codes the golang-migrate driver reads
        github.com/golang-migrate/migrate: >-
          the migration runner latere.ai/x/pkg/pgxmigrate drives, with the
          pgx/v5 database driver this repository blank-imports so the schema
          of spec 010 is applied at start-up and never by hand
        k8s.io/client-go: >-
          the Kubernetes client spec 001 admits for the k8s driver of spec
          004: the driver of the container isolation class talks to one
          cluster and to nothing else
        k8s.io/api: the Kubernetes object types the k8s driver renders
        k8s.io/apimachinery: the Kubernetes object machinery the client and the types are built on
        k8s.io/klog: the Kubernetes client's logging seam
        k8s.io/kube-openapi: the schema the Kubernetes client decodes objects against
        k8s.io/utils: the Kubernetes client's clock, net and pointer helpers
        sigs.k8s.io/json: the case-sensitive JSON decoder the Kubernetes client uses
        sigs.k8s.io/randfill: a dependency of the Kubernetes object machinery
        sigs.k8s.io/structured-merge-diff: the apply and merge machinery of the Kubernetes client
        sigs.k8s.io/yaml: the YAML half of the Kubernetes client's decoders
        github.com/gorilla/websocket: >-
          the WebSocket server and client of spec 008's streams: the exec and
          attach sockets of spec 034, the gateway sync stream of spec 018, and the
          Kubernetes client's exec stream.
          The standard library has no WebSocket, and both streams need the
          same framing, close codes and one-writer rule
        github.com/moby/spdystream: the Kubernetes client's exec stream upgrade where a cluster offers no websocket
        github.com/mxk/go-flowrate: the Kubernetes client's stream rate limiter
        github.com/spf13/pflag: a dependency of the Kubernetes client's configuration loader
        github.com/davecgh/go-spew: a dependency of the Kubernetes object machinery's diagnostics
        github.com/emicklei/go-restful: a dependency of the Kubernetes client's schema
        github.com/fxamacker/cbor: the CBOR codec the Kubernetes client negotiates
        github.com/x448/float16: a dependency of the CBOR codec
        github.com/go-openapi/jsonpointer: a dependency of the Kubernetes client's schema
        github.com/go-openapi/jsonreference: a dependency of the Kubernetes client's schema
        github.com/go-openapi/swag: a dependency of the Kubernetes client's schema
        github.com/google/gnostic-models: the OpenAPI models the Kubernetes client's discovery reads
        github.com/json-iterator/go: a dependency of the Kubernetes client's schema
        github.com/modern-go/concurrent: a dependency of the Kubernetes client's schema
        github.com/modern-go/reflect2: a dependency of the Kubernetes client's schema
        github.com/munnerz/goautoneg: the content negotiation of the Kubernetes client
        go.yaml.in/yaml: the YAML parser the Kubernetes decoders are built on
        gopkg.in/evanphx/json-patch.v4: the JSON patch the k8s driver's compare-and-swap is written as
        gopkg.in/inf.v0: the arbitrary-precision arithmetic behind a Kubernetes quantity
    latere.ai/x/cella/internal/check:
      decision: >-
        the check role of spec 014 asks the start-up path of the serve
        role one question at a time, so it reaches what that role
        reaches and nothing of its own: latere.ai/x/pkg and the
        OpenTelemetry SDK through internal/auth, the Kubernetes client
        through internal/config, whose k8s options are the driver's own
        type, and the Postgres driver for the one read that answers
        whether the database is at this binary's schema. It reaches no
        migration runner: the check reads the schema and never applies
        one (spec 010)
      allow:
        latere.ai/x/pkg: the shared library every Latere service is built on (spec 002)
        go.opentelemetry.io: >-
          the OpenTelemetry SDK spec 001 admits, reached through
          latere.ai/x/pkg/otel by the identity of spec 006: every
          outbound client this repository builds is instrumented
        google.golang.org/grpc: the OTLP exporters' transport, a dependency of the OpenTelemetry SDK
        google.golang.org/protobuf: the OTLP wire format, a dependency of the OpenTelemetry SDK
        google.golang.org/genproto: the OTLP status types, a dependency of the OpenTelemetry SDK
        golang.org/x: the Go project's extended library, a dependency of the OpenTelemetry SDK and gRPC
        github.com/grpc-ecosystem/grpc-gateway: the OTLP HTTP exporters' dependency
        github.com/go-logr: the OpenTelemetry SDK's logging seam
        github.com/google/uuid: request ids in latere.ai/x/pkg/httpjson
        github.com/felixge/httpsnoop: the response recorder of the SDK's HTTP instrumentation
        github.com/cespare/xxhash: a hash the OpenTelemetry SDK's metric pipeline uses
        github.com/cenkalti/backoff: the OTLP exporters' retry
        github.com/jackc/pgx: >-
          the Postgres driver and pool of spec 010, reached through
          internal/store/postgres: the durable store is what recovers a
          sandbox the data plane lost instead of forgetting it
        github.com/jackc/puddle: the connection pool github.com/jackc/pgx/v5/pgxpool is built on
        github.com/jackc/pgpassfile: the pgx driver's reader of the password file libpq defines
        github.com/jackc/pgservicefile: the pgx driver's reader of the service file libpq defines
        k8s.io/client-go: >-
          the Kubernetes client spec 001 admits for the k8s driver of spec
          004: the driver of the container isolation class talks to one
          cluster and to nothing else
        k8s.io/api: the Kubernetes object types the k8s driver renders
        k8s.io/apimachinery: the Kubernetes object machinery the client and the types are built on
        k8s.io/klog: the Kubernetes client's logging seam
        k8s.io/kube-openapi: the schema the Kubernetes client decodes objects against
        k8s.io/utils: the Kubernetes client's clock, net and pointer helpers
        sigs.k8s.io/json: the case-sensitive JSON decoder the Kubernetes client uses
        sigs.k8s.io/randfill: a dependency of the Kubernetes object machinery
        sigs.k8s.io/structured-merge-diff: the apply and merge machinery of the Kubernetes client
        sigs.k8s.io/yaml: the YAML half of the Kubernetes client's decoders
        github.com/gorilla/websocket: >-
          the WebSocket server and client of spec 008's streams: the exec and
          attach sockets of spec 034, the gateway sync stream of spec 018, and the
          Kubernetes client's exec stream.
          The standard library has no WebSocket, and both streams need the
          same framing, close codes and one-writer rule
        github.com/moby/spdystream: the Kubernetes client's exec stream upgrade where a cluster offers no websocket
        github.com/mxk/go-flowrate: the Kubernetes client's stream rate limiter
        github.com/spf13/pflag: a dependency of the Kubernetes client's configuration loader
        github.com/davecgh/go-spew: a dependency of the Kubernetes object machinery's diagnostics
        github.com/emicklei/go-restful: a dependency of the Kubernetes client's schema
        github.com/fxamacker/cbor: the CBOR codec the Kubernetes client negotiates
        github.com/x448/float16: a dependency of the CBOR codec
        github.com/go-openapi/jsonpointer: a dependency of the Kubernetes client's schema
        github.com/go-openapi/jsonreference: a dependency of the Kubernetes client's schema
        github.com/go-openapi/swag: a dependency of the Kubernetes client's schema
        github.com/google/gnostic-models: the OpenAPI models the Kubernetes client's discovery reads
        github.com/json-iterator/go: a dependency of the Kubernetes client's schema
        github.com/modern-go/concurrent: a dependency of the Kubernetes client's schema
        github.com/modern-go/reflect2: a dependency of the Kubernetes client's schema
        github.com/munnerz/goautoneg: the content negotiation of the Kubernetes client
        go.yaml.in/yaml: the YAML parser the Kubernetes decoders are built on
        gopkg.in/evanphx/json-patch.v4: the JSON patch the k8s driver's compare-and-swap is written as
        gopkg.in/inf.v0: the arbitrary-precision arithmetic behind a Kubernetes quantity
    latere.ai/x/cella/cmd/cella-stubs:
      decision: >-
        the test stubs of spec 012 reach latere.ai/x/pkg and the standard
        library and nothing of the control plane: no store, no driver, no
        Kubernetes client and no Podman client. The issuer is
        latere.ai/x/pkg/authkit/issuertest and the authorizer is
        latere.ai/x/pkg/authz/stub, both behind a listener of
        internal/stubs; the admission endpoint of spec 007 and the sink of
        spec 009 are written there against the spec and not against the
        client, because a stub built from the code it stands opposite
        agrees with that code whatever either one does
      allow:
        latere.ai/x/pkg: the shared library every Latere service is built on (spec 002)
        github.com/google/uuid: request ids in latere.ai/x/pkg/httpjson
    latere.ai/x/cella/internal/egressd:
      decision: >-
        the egress role reaches latere.ai/x/pkg/egress, the WebSocket
        library its one outbound stream speaks, and the standard library,
        and nothing of the control plane: no store, no issuer, no
        authorizer, no Kubernetes or Podman client (spec 001). The
        OpenTelemetry SDK and its transport arrive with
        latere.ai/x/pkg/egress itself, whose JWT proxy verifier reaches a
