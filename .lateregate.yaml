# The shared quality bar, read by `go tool lateregate`. The gates live in
# latere.ai/x/ci-gate, pinned in go.mod; only repository-specific values are
# here.

cover:
  trim_prefix: latere.ai/x/cella/

spec:
  archive:
    dir: .archive
    statuses: [complete, superseded]
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  started: [dispatched, in-progress, testing, complete]
  settled: [complete, superseded]
  require_section:
    - Overview
    - Design
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]

# Native execution and HTTP end-to-end tests run real sh, cat, and sleep
# commands (specs 025 and 028). Only the system tool directories join Go.
hermetic:
  allow: [/usr/bin, /bin]

tempdir:
  allow: {}

# Spec 001's dependency rule: the build list of ./cmd/cellad reaches the
# standard library, latere.ai/x/pkg, the Kubernetes and Podman clients the
# drivers of spec 004 drive, the Postgres driver of spec 010, and the
# OpenTelemetry SDK, and no cloud SDK. Until those specs land the list is
# the standard library and pkg, so a new dependency is a decision
# recorded here, one row per role package as the roles land.
depcheck:
  packages:
    latere.ai/x/cella/cmd/cellad:
      decision: >-
        the server reaches latere.ai/x/pkg and the standard library, and
        the OpenTelemetry SDK with what it pulls in, which joined with
        spec 006 through the tracing transport the verifier and the
        authorizer client dial with; the Kubernetes client joins the list
        with spec 004, the Postgres driver with spec 010, and nothing
        else does without a row here (spec 001)
      allow:
        latere.ai/x/pkg: the shared library every Latere service is built on (spec 002)
        go.opentelemetry.io: >-
          the OpenTelemetry SDK spec 001 admits, reached through
          latere.ai/x/pkg/otel by the identity of spec 006: every
          outbound client this repository builds is instrumented
        google.golang.org/grpc: the OTLP exporters' transport, a dependency of the OpenTelemetry SDK
        google.golang.org/protobuf: the OTLP wire format, a dependency of the OpenTelemetry SDK
        google.golang.org/genproto: the OTLP status types, a dependency of the OpenTelemetry SDK
        golang.org/x: the Go project's extended library, a dependency of the OpenTelemetry SDK and gRPC
        github.com/grpc-ecosystem/grpc-gateway: the OTLP HTTP exporters' dependency
        github.com/go-logr: the OpenTelemetry SDK's logging seam
        github.com/google/uuid: request ids in latere.ai/x/pkg/httpjson
        github.com/felixge/httpsnoop: the response recorder of the SDK's HTTP instrumentation
        github.com/cespare/xxhash: a hash the OpenTelemetry SDK's metric pipeline uses
        github.com/cenkalti/backoff: the OTLP exporters' retry
        github.com/jackc/pgx: >-
          the Postgres driver and pool of spec 010, reached through
          internal/store/postgres: the durable store is what recovers a
          sandbox the data plane lost instead of forgetting it
        github.com/jackc/puddle: the connection pool github.com/jackc/pgx/v5/pgxpool is built on
        github.com/jackc/pgpassfile: the pgx driver's reader of the password file libpq defines
        github.com/jackc/pgservicefile: the pgx driver's reader of the service file libpq defines
        github.com/jackc/pgerrcode: the Postgres error codes the golang-migrate driver reads
        github.com/golang-migrate/migrate: >-
          the migration runner latere.ai/x/pkg/pgxmigrate drives, with the
          pgx/v5 database driver this repository blank-imports so the schema
          of spec 010 is applied at start-up and never by hand

# Spec 010's store reads one operator-supplied URL, CELLA_DB_URL, on a direct
# endpoint or a session-mode pooler: a migration holds a session-scoped lock
# across its statements, which a transaction-mode pooler loses between
# transactions. The family's two-name convention, a pooled serving DSN beside
# a direct migration DSN, belongs to the plane that deploys this binary and
# not to the open core it deploys.
postgres:
  role: direct

license:
  spdx: Apache-2.0
  holder: Latere AI

# The identity shape shared across the open cores.
identity:
  role: core
  audience: cella
  config_prefix: CELLA
  api_group: cella.latere.ai
  # The default audience of the open core, verified only where the core is
  # self-hosted; the hosted plane is latere-ai/sandbox, audience sandboxd.
  reached_by: self-hosted
  # Access is by role: the roles rule runs, and it is one way once set.
  roles_only: true
