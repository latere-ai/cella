#
# The release pipeline of spec 014, on a v* tag, through latere-ai/ci's
# shared image release stages with cella's own checks between and after
# them. The build stage requires that the tag's commit passed verify, checks
# the tag and its CHANGELOG section, and builds the eight archives; then it
# builds the three images, cellad, the cella-display desktop and the
# cella-stubs test image, pushes each by digest and under no tag, checks
# cellad reports the version the tag pins, signs each, and gives each a bill
# of materials and SBOM and provenance attestations; then it writes the
# deploy archive with cellad pinned by digest. The candidate is exercised
# before anything is tagged. Only then does the publish stage tag the
# digests, sign checksums.txt over every file the release attaches, and
# publish the GitHub release with the CHANGELOG section as its body. After
# that the install document is walked against the published artifacts, and
# the verify stage checks the release from a runner with no checkout.
#
# The image namespace is the repository owner's, so a fork's tag publishes
# under the fork's. Each job is granted only what it needs. Every
# third-party action cella's own jobs use is pinned by commit with its
# version in a comment.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read

# The names cella's own jobs pull, the same names the build stage's image
# slots give the images.
env:
  REGISTRY: ghcr.io
  IMAGE: cellad
  DISPLAY_IMAGE: cella-display
  STUBS_IMAGE: cella-stubs

jobs:
  # 1. Everything the release carries, built once from this checkout. The
  # images are pushed by digest and under no tag, so a run that stops
  # before publish leaves unreferenced digests and nothing an operator
  # could pull by accident.
  build:
    uses: latere-ai/ci/.github/workflows/image-build.yml@v1
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      # The control plane. Dockerfile.ci copies the Linux binaries
      # archives_command built, so the image and the archive carry one
      # compilation, and cellad answers `version` with
      # "cellad <tag> (<commit>, <date>)".
      image_1: '{"name": "cellad", "dockerfile": "Dockerfile.ci", "version_args": "version", "version_expect": "{name} {tag} ("}'
      # The desktop of spec 014, which an operator names in
      # CELLA_K8S_DISPLAY_IMAGE. Its build runs the package manager, so
      # the arm64 half runs under the emulation the build stage sets up.
      # It carries no binary of this repository, so it has no version to
      # report.
      image_2: '{"name": "cella-display", "dockerfile": "images/display/Dockerfile"}'
      # The test stubs of spec 012, which the kind jobs below run beside
      # the candidate. It is for amd64 alone, the hosted runners' kind
      # clusters, and deploy/base never names it.
      image_3: '{"name": "cella-stubs", "dockerfile": "Dockerfile.stubs", "platforms": "linux/amd64"}'
      # The four archives of the server and the four of the client of spec
      # 011, and the two Linux server binaries Dockerfile.ci copies.
      archives_command: tools/release/build.sh "$TAG" dist
      # The unarchived binaries were for Dockerfile.ci alone; the release
      # attaches the archives that carry them. The deploy archive is the
      # base with cellad pinned to this release by digest, the bootstrap
      # templates and the examples, under one deploy/ directory. The
      # overlays are rendered here, so an archive that does not build
      # never reaches the release page.
      after_images_command: |
        rm -f dist/cellad_linux_amd64 dist/cellad_linux_arm64
        ref="${IMAGE_1%@*}"
        digest="${IMAGE_1#*@}"
        printf 'images:\n  - name: %s\n    newName: %s\n    digest: %s\n' "${ref##*/}" "$ref" "$digest" \
          >> deploy/base/kustomization.yaml
        for overlay in deploy/base deploy/examples/kind deploy/examples/generic; do
          rendered=$(kubectl kustomize "$overlay")
          grep -qF "image: ${IMAGE_1}" <<< "$rendered" \
            || { echo "$overlay does not render the published image" >&2; exit 1; }
        done
        tar -czf "dist/deploy-${TAG}.tar.gz" deploy
      runs_on: ubuntu-latest

  # 2. The candidate exercised before anything is tagged.
  #
  # What runs for real: the race tier over the whole module at the tag,
  # which carries the driver conformance suite of runtime/runtimetest over
  # the native driver and over podman with the engine this job starts; and
  # the published image itself, asked to check an installation, where it
  # must name the unreachable issuer and exit 1. The build stage already
  # asked it for its identity.
  #
  # Then the kind stack of spec 012, brought up from the published images:
  # the overlay deploy/examples/kind-stubs runs `cella-stubs` beside
  # `cellad` in one Pod, and the kind tier drives the whole lifecycle
  # through the API with a token from the stub issuer.
  #
  # Then the API conformance suite of spec 015 against that stack, which is
  # what spec 014's diagram names: every case of the contract, from the
  # images this tag published, with the gaps this server declares read from
  # test/conformance/known.json.
  conformance:
    name: the candidate passes what is built
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      OWNER: ${{ needs.build.outputs.owner }}
      DIGEST: ${{ needs.build.outputs.digest_1 }}
      DISPLAY_DIGEST: ${{ needs.build.outputs.digest_2 }}
      STUBS_DIGEST: ${{ needs.build.outputs.digest_3 }}
      XDG_RUNTIME_DIR: /tmp/xdg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # ubuntu-latest ships Podman, so the container driver's conformance
      # run is a real one rather than a skip.
      # The driver looks for $XDG_RUNTIME_DIR/podman/podman.sock and then
      # /run/podman/podman.sock. A hosted runner sets neither variable nor
      # socket, so the job names the directory itself, at the job level so
      # the test step reads the same one, and starts the engine detached so
      # it outlives the step that started it.
      - name: A rootless engine for the container driver's suite
        run: |
          mkdir -p "${XDG_RUNTIME_DIR}/podman"
          nohup podman system service --time=0 "unix://${XDG_RUNTIME_DIR}/podman/podman.sock" >/tmp/podman.log 2>&1 &
          for _ in $(seq 1 100); do [ -S "${XDG_RUNTIME_DIR}/podman/podman.sock" ] && break; sleep 0.2; done
          test -S "${XDG_RUNTIME_DIR}/podman/podman.sock" || { cat /tmp/podman.log; exit 1; }
      - name: The race tier at the tag
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee /tmp/race.log
      # The driver suite skips where no engine answers, so a green race
      # tier alone does not say the container driver was exercised.
      - name: The container driver's conformance suite ran
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 -v -run '^TestPodmanConformance$' ./runtime/podman/... 2>&1 | tee /tmp/podman-suite.log
          grep -q -- '--- PASS: TestPodmanConformance' /tmp/podman-suite.log \
            || { echo "the container driver's suite did not run; no engine answered" >&2; exit 1; }
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # `cellad check` from the published image, against an installation
      # whose issuer is not there: it must name the issuer, report every
      # optional dependency as not configured, and exit 1. The positive
      # path is the package's own suite, which runs a real issuer; this is
      # the proof that the subcommand is in the image an operator pulls,
      # reads that Pod's environment, and fails closed.
      - name: The image checks an installation and fails closed
        run: |
          key=$(openssl genrsa 2048 2>/dev/null)
          set +e
          out=$(docker run --rm \
            -e CELLA_OIDC_ISSUERS=http://127.0.0.1:1 \
            -e CELLA_PUBLIC_URL=http://127.0.0.1:8080 \
            -e CELLA_TOKEN_KEY="$key" \
            -e CELLA_RUNTIME=native -e CELLA_ALLOW_UNSAFE_NATIVE=true \
            -e CELLA_DATA_DIR=/tmp/cella \
            "${REGISTRY}/${OWNER}/${IMAGE}@${DIGEST}" check)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ] || { echo "check exited $code, want 1" >&2; exit 1; }
          echo "$out" | grep -q '^identity *FAIL' || { echo "the issuer that does not answer is not the failing line" >&2; exit 1; }
          for line in admission sink store gateway; do
            echo "$out" | grep -q "^$line *skip" || { echo "$line is not reported as not configured" >&2; exit 1; }
          done
          echo "$out" | grep -q '^data directory *ok' || { echo "the data directory is not writable in the image" >&2; exit 1; }
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      # The cluster runs the bytes this tag published, under the names the
      # overlay gives them: all three images are pulled by digest, and none
      # is built here.
      - name: The published images under the names the overlay runs
        run: |
          docker pull "${REGISTRY}/${OWNER}/${IMAGE}@${DIGEST}"
          docker tag "${REGISTRY}/${OWNER}/${IMAGE}@${DIGEST}" cellad:dev
          docker pull "${REGISTRY}/${OWNER}/${DISPLAY_IMAGE}@${DISPLAY_DIGEST}"
          docker tag "${REGISTRY}/${OWNER}/${DISPLAY_IMAGE}@${DISPLAY_DIGEST}" cella-display:dev
          docker pull "${REGISTRY}/${OWNER}/${STUBS_IMAGE}@${STUBS_DIGEST}"
          docker tag "${REGISTRY}/${OWNER}/${STUBS_IMAGE}@${STUBS_DIGEST}" cella-stubs:dev
      - name: The kind stack of spec 012
        env:
          CELLA_KIND_BUILD: '0'
        run: |
          bash deploy/examples/kind-stubs/up.sh -name cella >> "$GITHUB_ENV"
          echo "CELLA_TEST_SINK=http://localhost:30082" >> "$GITHUB_ENV"
          echo "CELLA_TEST_CLUSTER=cella" >> "$GITHUB_ENV"
      - name: The lifecycle through the API of the stack
        shell: bash
        run: |
          set -o pipefail
          go test -tags=e2e -count=1 -v -timeout 30m -run '^TestCluster' ./test/kind/... 2>&1 | tee /tmp/kind.log
          grep -q -- '--- PASS: TestClusterLifecycle' /tmp/kind.log
          grep -q -- '--- PASS: TestClusterDial' /tmp/kind.log
          grep -q -- '--- PASS: TestClusterEgressBoundary' /tmp/kind.log
          grep -q -- '--- PASS: TestClusterNoLateralMovement' /tmp/kind.log
          grep -q -- '--- PASS: TestClusterMeshReachability' /tmp/kind.log
      - name: The conformance suite against the published images
        shell: bash
        run: |
          set -o pipefail
          go test -tags=e2e -count=1 -v -timeout 30m -run '^TestContract$' ./test/conformance -args \
            -url "${CELLA_TEST_URL}" -issuer http://localhost:30081 -sink "${CELLA_TEST_SINK}" \
            -image docker.io/library/alpine:3.22 -capabilities files,pool,mesh,attach,dial,display,input,egress \
            -display-image cella-display:dev -upstream cella-upstream.cella.svc:80 \
            -known known.json 2>&1 | tee /tmp/conformance.log
          grep -q -- '--- PASS: TestContract' /tmp/conformance.log
      - name: The cluster's state, for a failed run
        if: failure()
        run: |
          kubectl -n cella get all || true
          kubectl -n cella logs deploy/cellad --tail=200 || true
          kubectl -n cella logs deploy/cellad -c stubs --tail=200 || true
          kubectl -n cella logs deploy/cellad-egress --tail=200 || true

  # 3. Only now do the digests get the :<tag> reference, and the release is
  # published with every file the build wrote and the CHANGELOG section as
  # its body.
  publish:
    needs: [build, conformance]
    uses: latere-ai/ci/.github/workflows/image-publish.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      images: ${{ needs.build.outputs.images }}
      runs_on: ubuntu-latest

  # 4. The install document against the published artifacts: the deploy
  # archive unpacked on a runner that has nothing of the checkout but the
  # document, and the image pulled by tag.
  #
  # The walk needs an OpenID Connect issuer the cluster can reach, and
  # cellad ships none. The stub issuer of spec 012 is what this tag
  # published beside the candidate, and the overlay
  # deploy/examples/kind-stubs runs it in the control plane's own Pod, so
  # the walk runs here on every tag: the archive unpacks, every overlay
  # renders against the published digest, the image carries the archive's
  # binary, and then the document's own blocks run against a cluster built
  # from the published images.
  install-release:
    name: the install document against the published artifacts
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      OWNER: ${{ needs.build.outputs.owner }}
      DIGEST: ${{ needs.build.outputs.digest_1 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The published artifacts, and nothing from the checkout
        run: |
          mkdir -p work && cd work
          # Each file by its id from the release's own assets endpoint,
          # which lists what is attached even when the release object's
          # embedded list does not.
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id)
          for name in "deploy-${GITHUB_REF_NAME}.tar.gz" "cellad_${GITHUB_REF_NAME}_linux_amd64.tar.gz" \
            "cellad_${GITHUB_REF_NAME}_linux_arm64.tar.gz" "cella_${GITHUB_REF_NAME}_linux_amd64.tar.gz"; do
            asset=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release}/assets" \
              --jq ".[] | select(.name == \"${name}\") | .id")
            test -n "${asset}" || { echo "the release lacks ${name}" >&2; exit 1; }
            gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}" > "${name}"
          done
          tar -xzf "deploy-${GITHUB_REF_NAME}.tar.gz"
          tar -xzf "cellad_${GITHUB_REF_NAME}_linux_amd64.tar.gz"
          tar -xzf "cella_${GITHUB_REF_NAME}_linux_amd64.tar.gz"
          ./cellad version
          # The client of spec 011 reports the same tag, from the archive an
          # agent's image would unpack.
          got=$(./cella version)
          echo "$got"
          case "$got" in
            "cella ${GITHUB_REF_NAME} ("*) ;;
            *) echo "the client reports '$got' and the tag is ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
          docker pull "${REGISTRY}/${OWNER}/${IMAGE}:${GITHUB_REF_NAME}"
      - name: Every overlay of the archive renders against the published image
        run: |
          cd work
          for overlay in deploy/base deploy/examples/kind deploy/examples/generic; do
            kubectl kustomize "$overlay" | grep -q "image: ${REGISTRY}/${OWNER}/${IMAGE}@${DIGEST}" \
              || { echo "$overlay of the archive does not name the published image" >&2; exit 1; }
          done
          echo "the archive's overlays render against ${REGISTRY}/${OWNER}/${IMAGE}@${DIGEST}"
      # The image and the archive carry one compilation (Dockerfile.ci): the
      # cellad of each platform of the published index is the cellad of
      # that platform's archive, byte for byte. Creating a container from
      # the index with --platform stores each platform under the index
      # digest and refuses the second, so each platform's own manifest
      # digest is read from the index and used directly.
      - name: The image carries the archive's binary
        run: |
          cd work
          ref="${REGISTRY}/${OWNER}/${IMAGE}"
          for arch in amd64 arm64; do
            platform=$(docker manifest inspect "${ref}:${GITHUB_REF_NAME}" | jq -r --arg a "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest')
            test -n "${platform}" || { echo "${ref}:${GITHUB_REF_NAME} holds no linux/${arch} image" >&2; exit 1; }
            id=$(docker create "${ref}@${platform}")
            docker cp "$id:/usr/local/bin/cellad" "cellad_image_${arch}"
            docker rm "$id" >/dev/null
            tar -xzOf "cellad_${GITHUB_REF_NAME}_linux_${arch}.tar.gz" cellad > "cellad_archive_${arch}"
            cmp "cellad_image_${arch}" "cellad_archive_${arch}"
            echo "cellad linux/${arch}: the image and the archive carry the same bytes"
          done
      # The document itself is the checkout's, and everything it applies is
      # the archive's. The walk needs the issuer the installation verifies
      # against, which is the stub issuer this tag published beside the
      # candidate, so it runs on every tag and not behind a variable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: checkout
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      - name: The published images under the names the archive's overlay runs
        run: |
          cd work
          docker pull "${REGISTRY}/${OWNER}/${STUBS_IMAGE}:${GITHUB_REF_NAME}"
          docker tag "${REGISTRY}/${OWNER}/${STUBS_IMAGE}:${GITHUB_REF_NAME}" cella-stubs:dev
          docker tag "${REGISTRY}/${OWNER}/${IMAGE}:${GITHUB_REF_NAME}" cellad:dev
          docker pull "${REGISTRY}/${OWNER}/${DISPLAY_IMAGE}:${GITHUB_REF_NAME}"
          docker tag "${REGISTRY}/${OWNER}/${DISPLAY_IMAGE}:${GITHUB_REF_NAME}" cella-display:dev
          # The archive's base pins the published digest, which the step
          # above already proved every overlay renders. The cluster runs the
          # same bytes under the name this runner loaded them with, so the
          # node pulls nothing and a private package is not a failed walk.
          sed -i -e "s#newName: ${REGISTRY}/${OWNER}/${IMAGE}#newName: cellad#" \
                 -e "s#digest: .*#newTag: dev#" deploy/base/kustomization.yaml
      - name: The cluster, the stubs and the control plane of the archive
        env:
          CELLA_KIND_BUILD: '0'
        run: |
          bash checkout/deploy/examples/kind-stubs/up.sh -name cella -manifests work/deploy >> "$GITHUB_ENV"
          echo "CELLA_TEST_CLUSTER=cella" >> "$GITHUB_ENV"
      - name: Walk the document against the cluster
        env:
          CELLA_INSTALL_IMAGE: cellad:dev
          CELLA_INSTALL_MANIFESTS: deploy
          CELLA_INSTALL_OVERLAY: examples/kind-stubs
          CELLA_INSTALL_ISSUER: http://127.0.0.1:9080
          CELLA_INSTALL_ADMIN: http://127.0.0.1:9080|dev
        run: |
          cd work
          export CELLA_INSTALL_TOKEN="${CELLA_TEST_TOKEN}"
          bash ../checkout/tools/docs/run-blocks.sh ../checkout/docs/install.md
      - name: The cluster's state, for a failed run
        if: failure()
        run: |
          kubectl -n cella get all || true
          kubectl -n cella logs deploy/cellad --tail=200 || true
          kubectl -n cella logs deploy/cellad -c stubs --tail=200 || true
          kubectl -n cella logs deploy/cellad-egress --tail=200 || true

  # 5. From a clean runner with no checkout: checksums.txt and its
  # signature, every asset against it, each image's signature and
  # attestations, and the body against the CHANGELOG section at the tag.
  release-verify:
    needs: publish
    uses: latere-ai/ci/.github/workflows/release-verify.yml@v1
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      images: |
        cellad
        cella-display
        cella-stubs
      runs_on: ubuntu-latest
