# Every push to main and every pull request runs the gate, the shared
# pipeline of latere-ai/ci, and the checks that need the tree and no
# cluster: a tidy module file and the license notice on every source
# file. The tiers that need a runtime backend beside them, a kind cluster
# or a container engine, are spec 012's and join here when that spec
# lands. Every third-party action is pinned by commit.
name: verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # Every job runs on GitHub's hosted runners. The repository is public,
  # so they cost nothing, and a hosted runner is a fresh machine per job.
  gate:
    if: "!startsWith(github.ref, 'refs/tags/')"
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1
    with:
      runs_on: ubuntu-latest
      test_os: '["ubuntu-latest"]'

  tidy:
    name: go.mod and go.sum are tidy
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Spec 001's dependency invariant names the module's direct
      # dependencies; go.mod is where a reader checks the claim, so it
      # has to agree with the imports.
      - run: go mod tidy -diff

  image:
    name: the developer image builds
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t cellad:candidate .
      - name: The image reports its version
        run: |
          docker run --rm cellad:candidate -version | grep -q '^cellad '

  # The deploy tree of spec 014 on every push, and the walk of
  # docs/install.md against a kind cluster, which spec 014 puts in this job
  # and slice 048 could not run: `cellad serve` verifies every caller
  # against an OpenID Connect issuer and ships none. The stub issuer of spec
  # 012 is now one of the four roles of `cella-stubs`, and the overlay
  # deploy/examples/kind-stubs runs it beside the control plane, so the walk
  # has an issuer, an authorizer and a sink with no dependency of the
  # runner's own.
  #
  # One cluster per run, and the walk and the tier share it: the stack is
  # brought up by the overlay's own up.sh, the document is then walked over
  # the cluster it left standing, and the kind tier runs against the same
  # URL with the same token.
  install:
    name: the deploy tree renders and the install document walks
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The assertions over the rendered tree live in deploy_test.go, which
      # skips where kubectl is absent. This step is what makes that skip
      # impossible: the runner has kubectl, so a run that skipped these
      # tests is a run that is not doing its job.
      - run: kubectl version --client
      - name: The base and every example render
        # `shell: bash` for pipefail: the default shell is `bash -e`
        # without it, `tee` exits 0, and a failing `go test` would be
        # swallowed by the pipe.
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v . 2>&1 | tee out.txt
          ! grep -q -- '--- SKIP' out.txt
      # `make run` on a clean clone: the stubs and cellad come up, a token
      # is minted at the stub issuer, and one sandbox is created with it.
      # It needs no cluster, so it runs before the slowest step.
      - name: The development stack comes up and creates a sandbox
        shell: bash
        run: |
          set -o pipefail
          go test -tags=e2e -count=1 -v -run '^TestRunBootstrap$' ./test/run/... 2>&1 | tee run.txt
          grep -q -- '--- PASS: TestRunBootstrap' run.txt
      # The contract of spec 015 against that same stack: every case the
      # native environment allows, with the gaps this server declares in
      # test/conformance/known.json read as declarations and not as passes.
      - name: The conformance suite against the development stack
        shell: bash
        run: |
          set -o pipefail
          go test -tags=e2e -count=1 -v -timeout 20m -run '^TestRunConformance$' ./test/run/... 2>&1 | tee conformance-run.txt
          grep -q -- '--- PASS: TestRunConformance' conformance-run.txt
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: The two images the stack runs
        run: |
          docker build -t cellad:dev .
          docker build -f Dockerfile.stubs -t cella-stubs:dev .
      - name: The cluster, the stubs and the control plane
        env:
          CELLA_KIND_BUILD: '0'
        run: |
          bash deploy/examples/kind-stubs/up.sh -name cella >> "$GITHUB_ENV"
          echo "CELLA_TEST_SINK=http://localhost:30082" >> "$GITHUB_ENV"
      # The tier runs before the document's walk, because the document ends
      # by deleting the cluster: its last block is how an operator removes
      # the installation, and the walk runs every block.
      - name: The kind tier against the stack
        shell: bash
        run: |
          set -o pipefail
          go test -tags=e2e -count=1 -v -timeout 30m -run '^TestCluster' ./test/kind/... 2>&1 | tee kind.txt
          grep -q -- '--- PASS: TestClusterLifecycle' kind.txt
      # The contract of spec 015 against the cluster: the same cases, on the
      # Kubernetes environment, with the subjects minted at the stub issuer's
      # node port and the capabilities that driver declares.
      - name: The conformance suite against the kind stack
        shell: bash
        run: |
          set -o pipefail
          go test -tags=e2e -count=1 -v -timeout 30m -run '^TestContract$' ./test/conformance -args \
            -url "${CELLA_TEST_URL}" -issuer http://localhost:30081 -sink "${CELLA_TEST_SINK}" \
            -image docker.io/library/alpine:3.22 -capabilities files,pool,mesh,attach \
            -known known.json 2>&1 | tee conformance-kind.txt
          grep -q -- '--- PASS: TestContract' conformance-kind.txt
      # The document is a program, and this is the run that proves it: the
      # same blocks an operator pastes, against the cluster above, with the
      # stub issuer as this installation's issuer.
      - name: Walk docs/install.md
        env:
          CELLA_INSTALL_IMAGE: cellad:dev
          CELLA_INSTALL_MANIFESTS: deploy
          CELLA_INSTALL_OVERLAY: examples/kind-stubs
          CELLA_INSTALL_ISSUER: http://127.0.0.1:9080
          CELLA_INSTALL_ADMIN: http://127.0.0.1:9080|dev
        run: |
          export CELLA_INSTALL_TOKEN="${CELLA_TEST_TOKEN}"
          bash tools/docs/run-blocks.sh docs/install.md
      - name: The cluster's state, for a failed run
        if: failure()
        run: |
          kubectl -n cella get all || true
          kubectl -n cella describe pod -l app.kubernetes.io/name=cellad || true
          kubectl -n cella logs deploy/cellad --tail=200 || true
          kubectl -n cella logs deploy/cellad -c stubs --tail=200 || true
